# Workflow general: descubre todas las soluciones bajo Apps/services/.
# Al agregar un microservicio con su .sln/.slnx, se prueba automáticamente.
# No está atado a ms-becas ni a un microservicio específico.
name: CI - Microservicios Ascenso

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  CONFIGURATION: Release

jobs:
  discover:
    name: Descubrir microservicios
    runs-on: ubuntu-latest
    outputs:
      solutions: ${{ steps.find.outputs.solutions }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Buscar soluciones bajo Apps/services
        id: find
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t solutions < <(
            find Apps/services -type f \( -name '*.sln' -o -name '*.slnx' \) \
              -not -path '*/bin/*' \
              -not -path '*/obj/*' \
              -not -path '*/node_modules/*' \
              | sort
          )

          if [ ${#solutions[@]} -eq 0 ]; then
            echo 'No se encontraron soluciones .sln/.slnx en Apps/services.'
            echo 'solutions=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf 'Soluciones encontradas:\n'
          printf '  - %s\n' "${solutions[@]}"

          json=$(printf '%s\n' "${solutions[@]}" | jq -R -s -c '
            split("\n")
            | map(select(length > 0))
            | map({
                solution: .,
                name: (gsub("/"; "-") | sub("\\.slnx?$"; ""))
              })
          ')
          echo "solutions=$json" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Build & Test - ${{ matrix.name }}
    needs: discover
    if: needs.discover.outputs.solutions != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.solutions) }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar .NET SDK según global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            **/*.csproj
            **/packages.lock.json
            **/Directory.Packages.props

      - name: Verificar SDK instalado
        run: dotnet --info

      - name: Restaurar dependencias
        run: dotnet restore "${{ matrix.solution }}"

      - name: Compilar solución en Release
        run: dotnet build "${{ matrix.solution }}" --no-restore --configuration "$CONFIGURATION" --warnaserror

      - name: Ejecutar pruebas unitarias y de arquitectura
        run: >
          dotnet test "${{ matrix.solution }}"
          --no-build
          --no-restore
          --configuration "$CONFIGURATION"
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --results-directory "$RUNNER_TEMP/test-results"

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: ${{ runner.temp }}/test-results
          if-no-files-found: warn
          retention-days: 7
