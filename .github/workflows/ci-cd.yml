name: CI - Ms-Becas Build & Test

on:
  push:
    branches:
      - main
      - Gerhard
      - feature-core
      - 'feature/**'
  pull_request:
    branches:
      - main
      - Gerhard

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Buscar archivo de solución (.sln)
      id: find_sln
      run: |
        SLN_PATH=$(find . -name "*.sln" | head -n 1)
        echo "Found solution at: $SLN_PATH"
        echo "sln_path=$SLN_PATH" >> $GITHUB_OUTPUT

    - name: Restaurar dependencias
      run: dotnet restore "${{ steps.find_sln.outputs.sln_path }}"

    - name: Compilar solución
      run: dotnet build "${{ steps.find_sln.outputs.sln_path }}" --no-restore --configuration Release

    - name: Ejecutar Pruebas Unitarias y de Arquitectura
      run: dotnet test "${{ steps.find_sln.outputs.sln_path }}" --no-build --configuration Release --verbosity normal